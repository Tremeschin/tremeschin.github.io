name: website
on:
  workflow_dispatch:
  push:
    paths:
      - "readme.md"
      - "website/**"
      - "zensical.toml"

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  main:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: BrokenSource/Pages@main
      - uses: actions/upload-pages-artifact@v5
      - uses: actions/deploy-pages@v5
